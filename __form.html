<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>API Form Target</title>
</head>
<body>
    <form name="api-notification" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
        <input type="text" name="bot-field" /> <!-- Spam bots will fill this in, humans won't -->
        <input type="text" name="name" />
        <input type="email" name="email" />
        <textarea name="message"></textarea>
    </form>
</body>
</html>
